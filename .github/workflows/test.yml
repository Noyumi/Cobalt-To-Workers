name: Workers checks

on: [pull_request, push]

permissions:
  contents: read

jobs:
  workers:
    name: Workers tests and frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test the API Worker
        run: pnpm test:workers
      - name: Check and build the frontend
        env:
          WEB_DEFAULT_API: https://api.example.test
        run: |
          pnpm --filter @imput/cobalt-web check
          pnpm --filter @imput/cobalt-web build
