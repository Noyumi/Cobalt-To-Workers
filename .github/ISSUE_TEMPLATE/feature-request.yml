name: feature request
description: suggest a feature for cobalt-to-workers
labels: ["feature request"]
body:
  - type: markdown
    attributes:
      value: see the [contributor guide](https://github.com/Noyumi/Cobalt-To-Workers/blob/main/CONTRIBUTING.md) for how this port runs.
  - type: textarea
    id: feat-description
    attributes:
      label: describe the feature you'd like to see
      description: describe what you'd like to do and where you get stuck today.
    validations:
      required: true
  - type: textarea
    id: more-context
    attributes:
      label: additional context
      description: add an example if it helps explain the request.
