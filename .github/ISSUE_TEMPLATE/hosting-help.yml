name: workers hosting help
description: ask for help running cobalt-to-workers locally or on cloudflare
labels: ["instance hosting help"]
body:
  - type: markdown
    attributes:
      value: start with the [workers setup guide](https://github.com/Noyumi/Cobalt-To-Workers/blob/main/docs/run-on-workers.md). redact secret values, cookies, and signed download urls before pasting anything here.
  - type: textarea
    id: problem-description
    attributes:
      label: problem description
      description: |
        include the setup step, the command you ran, and the error you saw.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: your instance configuration
      description: |
        include public settings from your wrangler config and the names of any relevant bindings.
        mention whether the issue is in the frontend worker or the api worker.
