name: service request
description: request a new download provider for cobalt-to-workers
title: "add support for [service name]"
labels: ["service request"]
body:
  - type: markdown
    attributes:
      value: check the [supported services](https://github.com/Noyumi/Cobalt-To-Workers/blob/main/docs/run-on-workers.md#what-you-can-download) and [contributor guide](https://github.com/Noyumi/Cobalt-To-Workers/blob/main/CONTRIBUTING.md#adding-a-service). requests should use freely accessible public media.
  - type: input
    id: service-name
    attributes:
      label: service name
    validations:
      required: true
  - type: textarea
    id: service-description
    attributes:
      label: service description
      description: describe the service and which media types you'd like to save.
    validations:
      required: true
  - type: textarea
    id: link-samples
    attributes:
      label: link samples
      description: |
        add public links that show what should work. include a short or share link if the service has one.
    validations:
      required: true
  - type: textarea
    id: more-context
    attributes:
      label: additional context
      description: add anything else that helps explain the expected download.
